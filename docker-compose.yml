
services:
  postgres:
    image: ankane/pgvector:latest
    container_name: sc_postgres
    environment:
      POSTGRES_USER: sc_user
      POSTGRES_PASSWORD: sc_password
      POSTGRES_DB: sales_copilot
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sc_redis
    ports:
      - "6379:6379"

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: sc_phoenix
    ports:
      - "6006:6006"   # Phoenix UI
      - "4317:4317"   # OTLP gRPC collector endpoint

  ollama:
    image: ollama/ollama:latest
    container_name: sc_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build: ./backend
    container_name: sc_backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - phoenix
    volumes:
      - ./backend:/app

volumes:
  pg_data:
  ollama_data:
